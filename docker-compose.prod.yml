version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: action-fitness-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-action_fitness}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-action_fitness}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: action-fitness-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: action-fitness-app-prod
    restart: always
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-action_fitness}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
      NODE_ENV: production
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      APP_URL: ${APP_URL}
    expose:
      - "3000"
    networks:
      - internal
      - public
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: action-fitness-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - public
    depends_on:
      - app

networks:
  internal:
    driver: bridge
    internal: true   # Database not reachable from the internet
  public:
    driver: bridge

volumes:
  pgdata-prod:
